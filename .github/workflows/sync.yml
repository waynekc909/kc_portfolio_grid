name: Sync Live Excel Data

on:
  push:
    paths:
      - '*.xlsx' # Triggers whenever an Excel model is pushed
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run Excel extraction script
        run: python live_excel_feed.py

      - name: Commit and push updated index.html
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live metrics from Excel" && git push)
